services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                HOST_UID: ${HOST_UID:-1000}
                HOST_GID: ${HOST_GID:-1000}
        container_name: esg-app
        working_dir: /var/www
        volumes:
            - ./:/var/www
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - esg

    nginx:
        image: nginx:alpine
        container_name: esg-nginx
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - esg

    postgres:
        image: postgres:18-alpine
        container_name: esg-postgres
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: ${DB_DATABASE:-esg}
            POSTGRES_USER: ${DB_USERNAME:-esg}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-esg}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "pg_isready -U ${DB_USERNAME:-esg} -d ${DB_DATABASE:-esg}"
              ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - esg

networks:
    esg:

volumes:
    postgres-data:
